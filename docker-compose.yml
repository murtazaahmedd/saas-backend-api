services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: saas}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20}
  api:
    build: .
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/saas
      JWT_SECRET: change-me-to-a-long-random-string-please
    ports: ["8000:8000"]
